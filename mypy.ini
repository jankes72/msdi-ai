[mypy]
# SSI Mypy Configuration
# ======================

# Ogólne
python_version = 3.11
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
warn_incomplete_defs = true

# Ignoruj brakujące importy (zewnętrzne biblioteki)
ignore_missing_imports = true

# Wyłącz sprawdzanie dla zewnętrznych bibliotek
# (np. tensorflow, pandas, numpy, scipy, sklearn, etc.)
[mypy-numpy.*]
ignore_missing_imports = true

[mypy-pandas.*]
ignore_missing_imports = true

[mypy-scipy.*]
ignore_missing_imports = true

[mypy-sklearn.*]
ignore_missing_imports = true

[mypy-tensorflow.*]
ignore_missing_imports = true

[mypy-statsmodels.*]
ignore_missing_imports = true

[mypy-requests.*]
ignore_missing_imports = true

[mypy-YAML.*]
ignore_missing_imports = true

[mypy-pydantic.*]
ignore_missing_imports = true

[mypy-deap.*]
ignore_missing_imports = true

# Ustawienia dla SSI
[mypy-SSI.*]
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = true

# Wyłącz sprawdzanie typów dla plików generowanych
[mypy-pamiec_modeli_v2.*]
ignore_missing_imports = true
disallow_untyped_calls = false

# Raporty
show_column_numbers = true
show_error_context = true
show_error_codes = true
pretty = true

# Pliki do sprawdzenia
files = 
    SSI/,
    tests/

# Wyłącz dla testów (mniej rygorystyczne)
[mypy-tests.*]
disallow_untyped_calls = false
disallow_incomplete_defs = false
